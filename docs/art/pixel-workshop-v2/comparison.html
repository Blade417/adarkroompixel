<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>木屋物件 · 调整前后对照</title>
<style>
  *{box-sizing:border-box}body{margin:0;padding:24px;background:#0b1014;color:#d5cdb8;font:16px/1.6 system-ui,sans-serif}
  main{max-width:1280px;margin:auto}h1{font-size:22px;margin:0 0 8px}p{color:#a9aa9f;margin:8px 0 20px}
  .compare{position:relative;overflow:hidden;border:1px solid #363c3c;--split:50%}
  img{display:block;width:100%;height:auto;image-rendering:pixelated}.after{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--split)) 0 0)}
  .line{position:absolute;top:0;bottom:0;left:var(--split);width:2px;background:#c8a774;pointer-events:none}
  .tag{position:absolute;top:8px;padding:3px 9px;background:#101519e8;font-size:13px}.new{left:8px}.old{right:8px}
  label{display:block;margin-top:16px}input{width:100%;accent-color:#c8a774}button{background:#1c2428;border:1px solid #69706a;color:inherit;padding:8px 14px;margin:8px 8px 0 0;cursor:pointer;font:inherit}
  button:focus-visible,input:focus-visible{outline:2px solid #d1b17d;outline-offset:3px}
</style>
<main>
  <h1>木屋物件 · 调整前后对照</h1>
  <p>推车缩小并收进门旁，陷阱与毛皮堆错开，重绘木色、视角并增加贴地阴影。两张均为实际游戏截图，炉火、飘雪及日志随游戏时间变化。</p>
  <div class="compare" id="comparison">
    <img src="playtest/before-warm.png" alt="调整前：推车较大，陷阱与毛皮堆重叠">
    <img class="after" src="playtest/after.png" alt="调整后：推车靠近门旁，陷阱独立放在毛皮堆左侧">
    <div class="line"></div><span class="tag new">调整后</span><span class="tag old">调整前</span>
  </div>
  <label for="split">拖动对照分界线</label>
  <input type="range" id="split" min="0" max="100" value="50">
  <button type="button" data-value="0">查看调整前</button><button type="button" data-value="100">查看调整后</button><button type="button" data-value="50">左右对照</button>
</main>
<script>
  const split=document.getElementById('split'), comparison=document.getElementById('comparison');
  const render=()=>comparison.style.setProperty('--split',split.value+'%');
  split.addEventListener('input',render);
  document.querySelectorAll('[data-value]').forEach(button=>button.addEventListener('click',()=>{split.value=button.dataset.value;render()}));
</script>
</html>
